version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idu-fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./samples:/app/samples
      - ./output:/app/output
      - ./weights:/app/weights
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idu-streamlit-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./samples:/app/samples
      - ./output:/app/output
      - ./weights:/app/weights
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    restart: unless-stopped
